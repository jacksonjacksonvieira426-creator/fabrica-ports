name: Build PSP Homebrew

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: sudo apt-get install -y build-essential cmake libarchive-tools

      - name: Baixar PSPSDK (pspdev)
        run: |
          wget -q https://github.com/pspdev/pspdev/releases/latest/download/pspdev-ubuntu-latest-x86_64.tar.gz -O pspdev.tar.gz
          tar -xzf pspdev.tar.gz
          echo "$PWD/pspdev/bin" >> $GITHUB_PATH
          echo "PSPDEV=$PWD/pspdev" >> $GITHUB_ENV

      - name: Compilar
        run: |
          cd src
          make

      - name: Upload EBOOT.PBP
        uses: actions/upload-artifact@v4
        with:
          name: EBOOT-PSP
          path: src/EBOOT.PBP
          if-no-files-found: warn
